# Render Blueprint — Nexsus.Guard (Chargeback Evidence Responder)
# Deploy: Render Dashboard -> New + -> Blueprint -> connect this repo.
# Both services build from the same package; free plans spin down when idle.

services:
  # FastAPI backend: win-probability scoring, evidence, rebuttal letters
  - type: web
    name: nexsus-guard-api
    runtime: python
    rootDir: chargeback_evidence_responder
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: MPLBACKEND
        value: Agg

  # Streamlit dashboard: self-contained (imports the package directly)
  - type: web
    name: nexsus-guard-dashboard
    runtime: python
    rootDir: chargeback_evidence_responder
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: MPLBACKEND
        value: Agg
